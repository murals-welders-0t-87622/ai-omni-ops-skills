<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>S19 · 插上插座 · SVG 电流 + snap 落位</title>
<link rel="stylesheet" href="../design-tokens.css">
<link rel="stylesheet" href="_shell.css">
<style>
/* ============================================================
   S19 · 63.640–68.640（5.00s）· SPLIT
   组件 broll-abstract.analogy — 插座隐喻（全片最重要类比）
   主色 芥末黄 · 动效 插头插入 snap 12f → 电流线亮起 12f → 计量跳动
   ============================================================ */
.b-pad { padding: 48px 56px; height: 100%; box-sizing: border-box;
         display: flex; flex-direction: column; }

.b-kicker { display: flex; align-items: baseline; gap: 16px; margin-bottom: 26px; }
.b-kicker .t-label { color: var(--a-mustard); }
.b-kicker .rule { flex: 1; height: 2px; background: rgba(60,44,24,.18); }

/* ---------- 类比两端 ---------- */
.analogy { display: grid; grid-template-columns: 1fr 78px 1fr; align-items: center; gap: 8px; }
.side {
  background: var(--c-paper); border: 1px solid var(--c-keyline);
  border-radius: 6px; box-shadow: var(--shadow-card);
  padding: 30px 32px; text-align: center;
}
.side--hero { background: var(--c-paper-deep); border: 3px solid var(--c-hairline); }
.side__t { font-size: 42px; font-weight: 800; line-height: 1.25; }
.side__s { margin-top: 10px; font-size: 26px; color: var(--c-ink-soft); }
.approx { font-size: 54px; font-weight: 900; color: rgba(60,44,24,.34); text-align: center; }

/* ---------- 插座图（SVG） ---------- */
.socket { flex: 1; margin-top: 30px; display: grid; place-items: center; }
.socket svg { width: 100%; max-height: 320px; overflow: visible; }
.sk-body { fill: var(--c-paper); stroke: var(--c-hairline); stroke-width: 4; }
.sk-hole { fill: #2B2A26; }
.sk-plug { fill: var(--c-paper-light); stroke: var(--c-hairline); stroke-width: 4; }
.sk-pin  { fill: #6b6055; }
.sk-wire { fill: none; stroke: rgba(60,44,24,.42); stroke-width: 6; stroke-linecap: round; }

/* 插头：从右侧滑入并 snap 落位（12f = .40s，末段无回弹） */
.plug { transform: translateX(300px); }
.run .plug { animation: plugIn .40s cubic-bezier(.16,1.02,.3,1) .30s forwards; }
@keyframes plugIn { to { transform: translateX(0); } }

/* 电流线：dash 从插座向外流动 + 亮起 */
.flow {
  fill: none; stroke: var(--a-mustard); stroke-width: 6; stroke-linecap: round;
  stroke-dasharray: 16 20; opacity: 0;
}
.run .flow {
  animation: flowOn .40s ease-out .70s forwards,
             flowMove 1.1s linear .70s infinite;
}
@keyframes flowOn   { to { opacity: 1; } }
@keyframes flowMove { to { stroke-dashoffset: -72; } }

.spark { opacity: 0; }
.run .spark { animation: sparkPop .34s var(--ease-out) .66s forwards; }
@keyframes sparkPop {
  0%   { opacity: 0; transform: scale(.5); }
  60%  { opacity: 1; transform: scale(1.18); }
  100% { opacity: .95; transform: scale(1); }
}

/* ---------- 底部计量条 ---------- */
.meter {
  margin-top: 26px; display: flex; align-items: center; gap: 20px;
  background: var(--c-paper-deep); border: 3px solid var(--c-hairline);
  border-radius: 6px; padding: 22px 30px;
  opacity: 0;
}
.run .meter { animation: fadeUp .40s var(--ease-out) 1.10s forwards; }
@keyframes fadeUp { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
.meter__t { font-size: 36px; font-weight: 800; }
.meter__v {
  margin-left: auto; font-size: 46px; font-weight: 900;
  font-variant-numeric: tabular-nums; color: var(--a-mustard);
}
.meter__u { font-size: 24px; font-weight: 700; color: var(--c-ink-soft); margin-left: 6px; }

.side, .approx { opacity: 0; }
.run .side:nth-of-type(1) { animation: fadeUp .40s var(--ease-out) 0s   forwards; }
.run .approx              { animation: fadeUp .30s var(--ease-out) .13s forwards; }
.run .side--hero          { animation: fadeUp .40s var(--ease-out) .20s forwards; }
.run .frame-a > img { animation: slowPush 5s linear forwards; }
@keyframes slowPush { from{transform:scale(1.02);} to{transform:scale(1);} }
</style>
</head>
<body>
<div class="viewport"><div class="scaler">

  <div class="stage paper-grain layout-split">

    <div class="frame-a"><img src="../dh_p1a_frame_tail.jpg" alt=""></div>

    <div class="guide guide--gutter"
         style="left: calc(var(--split-a-left) + var(--split-a-width));
                width: var(--split-gutter);">
      <span class="guide__num">中缝 39px</span>
    </div>

    <div class="frame-b">
      <div class="b-pad">
        <div class="b-kicker">
          <span class="t-label">DeepSeek · 千问 等 100 款</span>
          <span class="rule"></span>
        </div>

        <div class="analogy">
          <div class="side">
            <div class="side__t">一次接入</div>
            <div class="side__s">统一门户</div>
          </div>
          <div class="approx">≈</div>
          <div class="side side--hero">
            <div class="side__t">插上<b class="x-mustard">插座</b><br>电自己来了</div>
          </div>
        </div>

        <div class="socket">
          <svg viewBox="0 0 760 260">
            <!-- 墙面插座 -->
            <rect class="sk-body" x="40" y="60" width="180" height="150" rx="14"/>
            <rect class="sk-hole" x="86"  y="104" width="20" height="52" rx="8"/>
            <rect class="sk-hole" x="154" y="104" width="20" height="52" rx="8"/>

            <!-- 电流线：从插座向右辐射到 100 款模型 -->
            <path class="sk-wire" d="M220,100 C330,100 380,70  520,70"/>
            <path class="sk-wire" d="M220,135 C330,135 380,135 520,135"/>
            <path class="sk-wire" d="M220,170 C330,170 380,200 520,200"/>
            <path class="flow"    d="M220,100 C330,100 380,70  520,70"/>
            <path class="flow"    d="M220,135 C330,135 380,135 520,135"/>
            <path class="flow"    d="M220,170 C330,170 380,200 520,200"/>

            <!-- 右端三个模型节点 -->
            <g>
              <circle cx="546" cy="70"  r="15" fill="var(--a-mustard)" opacity=".9"/>
              <circle cx="546" cy="135" r="15" fill="var(--a-mustard)" opacity=".9"/>
              <circle cx="546" cy="200" r="15" fill="var(--a-mustard)" opacity=".9"/>
              <text x="580" y="80"  font-size="26" font-weight="700" fill="#2B2A26">DeepSeek</text>
              <text x="580" y="145" font-size="26" font-weight="700" fill="#2B2A26">千问</text>
              <text x="580" y="210" font-size="26" font-weight="700" fill="#5A5348">… 100 款</text>
            </g>

            <!-- 插头（滑入 snap） -->
            <g class="plug">
              <path class="sk-wire" d="M300,135 C340,135 350,240 400,240"/>
              <rect class="sk-plug" x="228" y="96" width="76" height="68" rx="10"/>
              <rect class="sk-pin"  x="206" y="110" width="26" height="12" rx="5"/>
              <rect class="sk-pin"  x="206" y="138" width="26" height="12" rx="5"/>
            </g>

            <!-- 通电火花 -->
            <g class="spark" style="transform-origin:130px 135px">
              <circle cx="130" cy="135" r="46" fill="none"
                      stroke="var(--a-mustard)" stroke-width="5" opacity=".55"/>
              <circle cx="130" cy="135" r="24" fill="var(--a-mustard)" opacity=".28"/>
            </g>
          </svg>
        </div>

        <div class="meter">
          <div class="meter__t">用多少，按 Token 算多少</div>
          <div class="meter__v"><span id="tok">0</span><span class="meter__u">Token</span></div>
        </div>
      </div>
    </div>

    <div class="subtitle">像插上插座，电自己来了</div>
  </div>

</div></div>

<div class="hud">
  <span class="tag">S19</span>
  <b>插上插座</b><span>5.00s · SPLIT</span>
  <span class="sep"></span>
  <button id="btn-replay">重播</button>
  <label><input type="checkbox" id="chk-loop" checked>循环</label>
  <label><input type="checkbox" id="chk-guide">中缝辅助线</label>
</div>

<script src="_shell.js"></script>
<script>
initPreview({
  total: 5000,
  onReset: () => { document.getElementById('tok').textContent = '0'; },
  onRun: () => {
    /* 计量跳动：只表示"按量计费在走表"，非具体业务数字 */
    rollNumber(document.getElementById('tok'), 0, 128640, 45, 1150,
               v => Math.round(v).toLocaleString('en-US'));
  }
});
</script>
</body>
</html>
